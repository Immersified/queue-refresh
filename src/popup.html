<!doctype html>
<meta charset="utf-8">
<title>Queue Refresh</title>
<style>
  body { font: 13px system-ui, sans-serif; width: 260px; margin: 0; padding: 12px; }
  h1 { font-size: 13px; margin: 0 0 10px; }
  button { font: inherit; padding: 6px 10px; margin: 0 6px 6px 0; cursor: pointer; }
  #status { margin-top: 8px; color: #444; line-height: 1.4; min-height: 2.6em; }
  #queue { margin-top: 10px; padding-top: 10px; border-top: 1px solid #ddd; color: #444; }
  #queue b { font-weight: 600; }
  #queue .age { color: #888; }
  #log { margin-top: 8px; padding-top: 8px; border-top: 1px solid #ddd; color: #666; line-height: 1.4; white-space: pre-line; }
  #shots { margin-top: 4px; color: #666; line-height: 1.4; }
  #shots.failed { color: #b00; }
  #telegram { margin-top: 4px; color: #666; line-height: 1.4; }
  #telegram.failed { color: #b00; }
  #schedule { margin-top: 10px; padding-top: 10px; border-top: 1px solid #ddd; }
  #schedule label { display: block; color: #444; margin-bottom: 4px; }
  #when { font: inherit; width: 100%; box-sizing: border-box; padding: 4px; margin-bottom: 6px; }
  #countdown { margin-top: 6px; color: #666; line-height: 1.4; }
  #countdown.armed { color: #076; font-weight: 600; }
</style>
<h1>Queue Refresh</h1>
<button id="start">Start</button>
<button id="stop">Stop</button>
<button id="log-only">Log only</button>
<button id="stop-logging">Stop logging</button>
<button id="test-shot">Test shot</button>
<div id="status">Idle.</div>
<div id="queue">Queue: reading…</div>
<div id="log">Not logging.</div>
<div id="shots"></div>
<div id="telegram"></div>
<div id="schedule">
  <label for="when">Join at</label>
  <input type="datetime-local" id="when">
  <button id="arm">Arm</button>
  <button id="disarm">Disarm</button>
  <div id="countdown">Not armed.</div>
</div>
<script src="schedule.js"></script>
<script src="popup.js"></script>
